[tool.poetry]
name = "hedge-ai"
version = "0.1.0"
description = "Agentic AI Decision Support Framework for Volatility Risk Hedging in Palm Oil Mills"
authors = ["Foo <foo@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
certifi = "*"
charset-normalizer = "*"
et-xmlfile = "*"
idna = "*"
numpy = "*"
openpyxl = "*"
pandas = "*"
python-dateutil = "*"
pytz = "*"
requests = "*"
setuptools = "*"
six = "*"
tvdatafeed = {git = "https://github.com/rongardF/tvdatafeed.git", rev = "e6f6aaa7de439ac6e454d9b26d2760ded8dc4923"}
tzdata = "*"
urllib3 = "*"
websocket-client = "*"
gymnasium = "*"
stable-baselines3 = "*"
torch = "*"
scikit-learn = "*"
tensorboard = "^2.20.0"
optuna = "^4.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
